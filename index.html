<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Travel Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 1. Set the uploaded image as the fixed background using the RAW GitHub URL */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050505;
            
            /* BULLETPROOF FIX: Pulling directly from your GitHub repo */
            background-image: url('https://raw.githubusercontent.com/YashShrivastava009/tourplanner/main/image_da1ff9.jpg'); 
            
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            height: 100vh;
            width: 100vw;
        }
        
        /* 2. Animate the Black Hole: Rotating light overlay */
        .blackhole-swirl {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 200vw;
            height: 200vw;
            transform: translate(-50%, -50%);
            background: conic-gradient(
                from 0deg,
                transparent 0%,
                rgba(252, 211, 77, 0.1) 20%,
                rgba(245, 158, 11, 0.15) 40%,
                transparent 50%,
                rgba(252, 211, 77, 0.05) 70%,
                transparent 100%
            );
            animation: spinHole 20s linear infinite;
            mix-blend-mode: screen;
            pointer-events: none;
            z-index: 1;
            border-radius: 50%;
        }

        @keyframes spinHole {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        /* 3. Gentle floating stardust */
        .stardust {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 2;
            background-image: 
                radial-gradient(2px 2px at 10% 20%, #fcd34d, transparent),
                radial-gradient(2px 2px at 30% 60%, #ffffff, transparent),
                radial-gradient(2px 2px at 60% 80%, #f59e0b, transparent),
                radial-gradient(2px 2px at 80% 30%, #ffffff, transparent),
                radial-gradient(2px 2px at 40% 10%, #fcd34d, transparent),
                radial-gradient(2px 2px at 90% 90%, #ffffff, transparent);
            background-size: 150px 150px;
            animation: pullStars 12s linear infinite;
            opacity: 0.5;
        }

        @keyframes pullStars {
            0% { transform: scale(1) rotate(0deg); opacity: 0; }
            50% { opacity: 0.6; }
            100% { transform: scale(0.8) rotate(20deg); opacity: 0; }
        }
    </style>
</head>
<body class="text-white min-h-screen font-sans relative flex items-center justify-center">
    
    <!-- Background Animations over your image -->
    <div class="blackhole-swirl"></div>
    <div class="stardust"></div>

    <!-- Clean UI: Just the title, everything else removed -->
    <div class="relative z-10 p-10">
        <h1 class="text-6xl md:text-8xl font-extrabold text-amber-400 drop-shadow-[0_0_20px_rgba(245,158,11,1)] tracking-widest text-center uppercase">
            AI Travel
        </h1>
    </div>

</body>
</html>

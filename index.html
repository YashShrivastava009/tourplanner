<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Travel Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-8 font-sans">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-5xl font-bold mb-8 text-center text-blue-400">AI Travel Canvas</h1>
        
        <!-- Input Form -->
        <div class="bg-slate-800 p-6 rounded-2xl shadow-2xl mb-8 border border-slate-700">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <input type="text" id="origin" placeholder="Leaving from? (e.g. New York)" class="p-4 rounded-xl bg-slate-700 text-white outline-none focus:ring-2 focus:ring-blue-400">
                <input type="text" id="destination" placeholder="Where to? (e.g. Japan)" class="p-4 rounded-xl bg-slate-700 text-white outline-none focus:ring-2 focus:ring-blue-400">
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="number" id="days" placeholder="How many days?" class="p-4 rounded-xl bg-slate-700 text-white outline-none focus:ring-2 focus:ring-blue-400">
                <select id="budget" class="p-4 rounded-xl bg-slate-700 text-white outline-none focus:ring-2 focus:ring-blue-400 cursor-pointer">
                    <option value="Backpacker">Backpacker (Budget)</option>
                    <option value="Moderate">Moderate</option>
                    <option value="Luxury">Luxury (Premium)</option>
                </select>
            </div>
            <button onclick="planTrip()" class="w-full mt-6 bg-blue-500 hover:bg-blue-600 text-white font-bold py-4 px-4 rounded-xl transition duration-300 transform hover:scale-[1.02]">
                Start Planning
            </button>
        </div>

        <!-- Loading State -->
        <div id="loading" class="hidden flex flex-col items-center justify-center my-12">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-400 mb-4"></div>
            <p class="text-xl text-blue-400 font-medium">Analyzing routes and building your trip...</p>
        </div>

        <!-- Results Area -->
        <div id="itinerary" class="space-y-6"></div>
    </div>

    <script>
        async function planTrip() {
            const origin = document.getElementById('origin').value;
            const destination = document.getElementById('destination').value;
            const days = document.getElementById('days').value;
            const budget = document.getElementById('budget').value;
            const resultDiv = document.getElementById('itinerary');
            const loadingDiv = document.getElementById('loading');

            if(!origin || !destination || !days) {
                alert("Please fill in where you are leaving from, your destination, and days!");
                return;
            }

            resultDiv.innerHTML = '';
            loadingDiv.classList.remove('hidden');

            try {
                // Calling your live Render Backend WITH the password protection
                const response = await fetch('/api/plan-trip', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'x-site-password': 'mysecretpassword'
                    },
                    body: JSON.stringify({ origin, destination, days, budget })
                });
                
                if (!response.ok) {
                    throw new Error('Network response was not ok or unauthorized');
                }

                const data = await response.json();
                loadingDiv.classList.add('hidden');
                
                resultDiv.innerHTML = `
                    <div class="bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700">
                        <h2 class="text-2xl font-bold text-white mb-4">Your Custom Route:</h2>
                        <pre class="bg-slate-900 p-4 rounded-xl overflow-x-auto text-green-400 text-sm whitespace-pre-wrap">${JSON.stringify(data, null, 2)}</pre>
                    </div>`;
                
            } catch (error) {
                loadingDiv.classList.add('hidden');
                resultDiv.innerHTML = `<div class="bg-red-900/50 border border-red-500 p-4 rounded-xl text-red-200">Error connecting to server. Make sure the backend is fully deployed on Render.</div>`;
            }
        }
    </script>
</body>
</html>

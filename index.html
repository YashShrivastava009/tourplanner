<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Travel Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom CSS for the Spinning Globe Background */
        body {
            overflow-x: hidden;
            background-color: #0f172a; /* Dark slate background */
        }
        
        .globe-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90vw;
            max-width: 800px;
            aspect-ratio: 1 / 1;
            z-index: -1;
            pointer-events: none;
        }

        .globe {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 
                inset 0 0 80px #06b6d4, /* Inner Cyan Glow */
                0 0 120px rgba(6, 182, 212, 0.4); /* Outer Cyan Glow */
            position: relative;
            overflow: hidden;
            background: radial-gradient(circle at 30% 30%, rgba(30, 58, 138, 0.4), rgba(15, 23, 42, 1));
        }

        /* Creating the spinning wireframe grid */
        .globe::before, .globe::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 200%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(6, 182, 212, 0.4) 1px, transparent 1px),
                linear-gradient(90deg, rgba(6, 182, 212, 0.4) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: spin 20s linear infinite;
            border-radius: 50%;
        }

        .globe::after {
            background-size: 100px 100px;
            animation: spin 30s linear infinite reverse;
            opacity: 0.3;
        }

        /* 3D shadow effect over the grid */
        .globe-shadow {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 50%;
            box-shadow: inset -40px -40px 100px #0f172a, inset 40px 40px 100px rgba(15, 23, 42, 0.8);
            z-index: 2;
        }

        @keyframes spin {
            0% { transform: translateX(0) scale(1.3); }
            100% { transform: translateX(-50%) scale(1.3); }
        }
    </style>
</head>
<body class="text-white min-h-screen p-8 font-sans relative">
    
    <!-- Background Animated Globe -->
    <div class="globe-container">
        <div class="globe">
            <div class="globe-shadow"></div>
        </div>
    </div>

    <!-- Main UI Container (Now with Glassmorphism) -->
    <div class="max-w-4xl mx-auto relative z-10 pt-10">
        <h1 class="text-6xl font-extrabold mb-10 text-center text-cyan-400 drop-shadow-[0_0_15px_rgba(6,182,212,0.8)] tracking-tight">AI Travel Canvas</h1>
        
        <!-- Input Form -->
        <div class="bg-slate-800/60 backdrop-blur-lg p-8 rounded-3xl shadow-2xl mb-8 border border-cyan-500/30">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <input type="text" id="origin" placeholder="Leaving from? (e.g. New York)" class="p-4 rounded-xl bg-slate-900/70 text-white outline-none focus:ring-2 focus:ring-cyan-400 placeholder-slate-400 border border-slate-700 transition-all">
                <input type="text" id="destination" placeholder="Where to? (e.g. Japan)" class="p-4 rounded-xl bg-slate-900/70 text-white outline-none focus:ring-2 focus:ring-cyan-400 placeholder-slate-400 border border-slate-700 transition-all">
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <input type="number" id="days" placeholder="How many days?" class="p-4 rounded-xl bg-slate-900/70 text-white outline-none focus:ring-2 focus:ring-cyan-400 placeholder-slate-400 border border-slate-700 transition-all">
                <select id="budget" class="p-4 rounded-xl bg-slate-900/70 text-white outline-none focus:ring-2 focus:ring-cyan-400 cursor-pointer border border-slate-700 transition-all">
                    <option value="Backpacker">Backpacker (Budget)</option>
                    <option value="Moderate">Moderate</option>
                    <option value="Luxury">Luxury (Premium)</option>
                </select>
            </div>
            <button onclick="planTrip()" class="w-full mt-8 bg-cyan-600 hover:bg-cyan-500 text-white font-bold text-lg py-4 px-4 rounded-xl transition duration-300 transform hover:scale-[1.02] shadow-[0_0_20px_rgba(6,182,212,0.4)]">
                Start Planning
            </button>
        </div>

        <!-- Loading State -->
        <div id="loading" class="hidden flex flex-col items-center justify-center my-12">
            <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-cyan-400 mb-6 shadow-[0_0_15px_rgba(6,182,212,0.5)]"></div>
            <p class="text-2xl text-cyan-300 font-medium drop-shadow-md">Analyzing global routes...</p>
        </div>

        <!-- Results Area -->
        <div id="itinerary" class="space-y-6"></div>
    </div>

    <script>
        async function planTrip() {
            const origin = document.getElementById('origin').value;
            const destination = document.getElementById('destination').value;
            const days = document.getElementById('days').value;
            const budget = document.getElementById('budget').value;
            const resultDiv = document.getElementById('itinerary');
            const loadingDiv = document.getElementById('loading');

            if(!origin || !destination || !days) {
                alert("Please fill in where you are leaving from, your destination, and days!");
                return;
            }

            resultDiv.innerHTML = '';
            loadingDiv.classList.remove('hidden');

            try {
                // Calling your live Render Backend WITH the password protection
                const response = await fetch('/api/plan-trip', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'x-site-password': 'mysecretpassword'
                    },
                    body: JSON.stringify({ origin, destination, days, budget })
                });
                
                if (!response.ok) {
                    throw new Error('Network response was not ok or unauthorized');
                }

                const data = await response.json();
                loadingDiv.classList.add('hidden');
                
                resultDiv.innerHTML = `
                    <div class="bg-slate-800/80 backdrop-blur-xl p-8 rounded-3xl shadow-2xl border border-cyan-500/40">
                        <h2 class="text-3xl font-bold text-cyan-300 mb-6 drop-shadow-md">Your Custom Route:</h2>
                        <pre class="bg-slate-900/90 p-6 rounded-2xl overflow-x-auto text-green-400 text-sm whitespace-pre-wrap border border-slate-700 shadow-inner">${JSON.stringify(data, null, 2)}</pre>
                    </div>`;
                
            } catch (error) {
                loadingDiv.classList.add('hidden');
                resultDiv.innerHTML = `<div class="bg-red-900/80 border border-red-500 p-6 rounded-2xl text-red-100 backdrop-blur-md shadow-xl text-center font-medium">Error connecting to server. Make sure the backend is fully deployed on Render.</div>`;
            }
        }
    </script>
</body>
</html>
